basePath: /
definitions:
  dto.RequestServiceRequest:
    properties:
      service_code:
        example: passport_new
        type: string
    required:
    - service_code
    type: object
  dto.ServicesResponse:
    properties:
      id:
        example: 01a15d53-a46f-762b-bebd-4232ae144e8a
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Apply for a new passport
        type: string
      service_code:
        example: passport_new
        type: string
    type: object
  dto.TicketResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      number:
        example: PN-042
        type: string
      service_code:
        example: passport_new
        type: string
      status:
        example: new
        type: string
    type: object
  handlers.errorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: 'API for the queueing system: services, tickets and queue status.'
  title: Queueing System API
  version: "1.0"
paths:
  /services:
    get:
      description: Returns all services, including inactive ones, ordered by name.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ServicesResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: List services
      tags:
      - services
  /tickets:
    post:
      consumes:
      - application/json
      description: Customer chooses a service and receives a ticket number, e.g. PN-042.
        Numbers restart from 001 every day.
      parameters:
      - description: Service to request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TicketResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "404":
          description: Service not found
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "409":
          description: Service is not active
          schema:
            $ref: '#/definitions/handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.errorResponse'
      summary: Request a service
      tags:
      - tickets
swagger: "2.0"
