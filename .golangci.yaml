version: "2"

run:
  concurrency: 4
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true

linters:
  default: all
  disable:
    - containedctx
    - dogsled
    - godox
    - cyclop
    - decorder
    - dupword
    - funcorder
    - errchkjson
    - forbidigo
    - funlen
    - gocognit
    - gomodguard
    - exhaustruct
    - depguard
    - goconst
    - gocyclo
    - interfacebloat
    - ireturn
    - lll
    - nestif
    - nlreturn
    - paralleltest
    - testpackage
    - wsl
    - wrapcheck
    - varnamelen
    - tagliatelle
    - noinlineerr
    - gochecknoglobals
    - unqueryvet
    - exhaustruct_v5
    - gochecknoinits
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeExprCopy
        - rangeValCopy
    errcheck:
      check-type-assertions: true
    godot:
      exclude:
        # swag annotations like "@BasePath /" are not sentences
        - '^\s*@'
    govet:
      disable:
        - fieldalignment
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    paths:
      - docs # generated by swag

formatters:
  enable:
    - gci
    - gofumpt
    - swaggo
  settings:
    gci:
      sections:
        - standard
        - default
    gofumpt:
      extra-rules: true
  exclusions:
    warn-unused: true
    generated: lax
    paths:
      - migrations
      - docs
